    <script>
      // Aplica o tema salvo antes do primeiro paint, pra não piscar o
      // tema errado (FOUC) quando a preferência salva é "light".
      try {
        if (localStorage.getItem('rf-theme') === 'light') {
          document.documentElement.classList.add('light')
        }
      } catch (e) {}
    </script>
